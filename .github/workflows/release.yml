# Builds the jar on GitHub's runners and publishes it on a Release with a SHA-256 checksum and a
# signed build-provenance attestation. Nothing is uploaded by hand. Release by pushing a tag
# (git tag v1.0.0 && git push origin v1.0.0) or by publishing a release with a new tag on github.com.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write      # create the release
  id-token: write      # sign the attestation
  attestations: write  # store the attestation

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"

      - name: Check tag matches mod version
        run: |
          version=$(sed -nE 's/.*"version": *"([^"]+)".*/\1/p' res/fabric.mod.json)
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match fabric.mod.json version ${version}" >&2
            exit 1
          fi

      - name: Build
        run: ./build.sh

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.jar

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          jar=$(ls dist/*.jar)
          sha=$(cut -d' ' -f1 "$jar.sha256")
          cat > notes.md <<NOTES
          Unofficial, temporary fix for the Create: Testosterone 2.0.3 chunk leak. See the README.

          Built by GitHub Actions from commit ${GITHUB_SHA} with JDK 21.

          **SHA-256:** \`${sha}\`

          Verify the download came from this repository's workflow:
          \`\`\`
          gh attestation verify $(basename "$jar") --repo ${GITHUB_REPOSITORY}
          \`\`\`
          NOTES
          # The release may already exist if it was created on github.com (which also creates the tag).
          if gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" "$jar" "$jar.sha256" --repo "${GITHUB_REPOSITORY}" --clobber
            gh release edit "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --notes-file notes.md
          else
            gh release create "${GITHUB_REF_NAME}" "$jar" "$jar.sha256" \
              --repo "${GITHUB_REPOSITORY}" --title "${GITHUB_REF_NAME}" --notes-file notes.md
          fi
